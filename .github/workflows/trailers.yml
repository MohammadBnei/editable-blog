name: trailers

# Commit, title and body hygiene via MohammadBnei/ukubi-ci, pinned by sha
# (the sha of a ukubi-ci tag; bump it with checks.yml and release.yml when a newer tag ships).
# `edited` is listed so a title or body fix re-runs it; the latest event wins.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: trailers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trailers:
    uses: MohammadBnei/ukubi-ci/.github/workflows/trailers.yml@a1fff4170c861af16467a99fe5185bbb85bdfd08 # v0.11.3
    with:
      conventional: true
      # Content commits are `content(<area>): ...`, this repo's own type.
      allow-prefixes: content
      agent-trailers: pair
