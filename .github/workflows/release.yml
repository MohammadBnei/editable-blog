# Push to main -> ukubi-ci release.yml (git-cliff: an annotated X.Y.Z tag on the
# triggering commit, notes in its message; nothing is committed to main) -> ukubi-ci
# image.yml: buildah on the ukubi-build runner, tagged with the built commit's 12-char
# sha and the version as a build arg, pushed to the in-cluster registry, then the pin
# <sha>@<digest> committed to helm/image.yaml on the `deploy` branch (Argo CD layers it
# over helm/values.yaml). image.yml logs in to Infisical itself (Forgejo OIDC).
#
# The PR checks gate main (it only takes reviewed merges), so they are not re-run here.
# A commit that only touched paths-ignore'd files is released with the next push; to
# release or rebuild the tip now, dispatch this workflow on main.
name: Release, build and deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      # Root-level docs only. '**.md' would also ignore content/**.md, and publishing a
      # post here *is* a markdown-only commit — it would cut no release, push no tag, and
      # never rebuild the image.
      - '*.md'
      - '**.yml'
      - '**.yaml'
      - 'package.json'
    tags-ignore:
      - '*'

# Forgejo honours only workflow-level concurrency (the job-level groups inside
# ukubi-ci's image.yml are ignored there): main runs queue, so a build whose release
# tag is already pushed is never cancelled.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    permissions:
      contents: write # release.yml pushes the release tag
    uses: MohammadBnei/ukubi-ci/.github/workflows/release.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1

  # Build, push and deploy live in image.yml. A dispatch from a branch builds without
  # deploying (push-default-branch-only), so it cannot evict the rollback image from
  # Zot's last-3-tags retention.
  image:
    needs: release
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: editable-blog
      # The pin file on the deploy branch (ukubi-ci 0.11), not main's values.
      values-file: helm/image.yaml
      # The release commit; empty on a dry run or when nothing was released.
      ref: ${{ needs.release.outputs.tag }}
      version-arg: true
      version: ${{ needs.release.outputs.version }}
      push-default-branch-only: true
      # The release tag is pushed before the build: never cancel a running build.
      cancel-in-progress: false
    permissions:
      contents: write # the deploy job pushes the bump to the deploy branch
      id-token: write # the Infisical OIDC login
