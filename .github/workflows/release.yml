name: Release It

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      # Root-level docs only. '**.md' would also ignore content/**.md, and
      # publishing a post here *is* a markdown-only commit — it would cut no
      # release, push no tag, and never rebuild the image.
      - '*.md'
      - '**.yml'
      - '**.yaml'
      - 'package.json'
    tags-ignore:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Run release-it
        run: git update-index --refresh && git diff-index --quiet HEAD || git reset --hard && bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
