name: checks

# ponytail: PR checks are thin callers of MohammadBnei/ukubi-ci, pinned by sha
# (the sha of a ukubi-ci tag; bump it when a newer tag ships).
# They gate what reaches main, and release.yml calls them again (workflow_call)
# before it cuts a release: checks on main gate CD (owner decision, 2026-11-22).
# The trailers check lives in trailers.yml so a title or body edit re-runs it
# without re-running (or skipping, and so hiding) the bun check. No image build
# on a PR (owner decision, CI/CD split): images are CD's, from reviewed main.
on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer PR push cancels the older run; release.yml's call never cancels. The
# PR payload, not event_name, which Forgejo reports as workflow_call in a call.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.pull_request && true || false }}

jobs:
  bun:
    uses: MohammadBnei/ukubi-ci/.github/workflows/bun-checks.yml@d683f2091575188024f7e1200e619977d9db19ae # ukubi-ci PR 28 head; re-pin to the release
    with:
      typecheck-script: '' # svelte-check runs inside the build script
      lint-script: lint
      test-script: test
      build-script: build
