name: checks

# ponytail: PR checks are thin callers of MohammadBnei/ukubi-ci, pinned by sha
# (the sha of a ukubi-ci tag; bump it when a newer tag ships).
# release.yml calls this same file (workflow_call), so main cannot tag, build or deploy
# unless lint, tests, the real build and the image build pass.
# The trailers check lives in trailers.yml so a title or body edit re-runs it
# without re-running (or skipping, and so hiding) the bun and image checks.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

jobs:
  bun:
    uses: MohammadBnei/ukubi-ci/.github/workflows/bun-checks.yml@8782d42e1d4e5cd0b8af9d1a14c9d5414976a4c9 # v0.7.0
    with:
      typecheck-script: ''
      lint-script: lint
      test-script: test
      build-script: build

  image:
    uses: MohammadBnei/ukubi-ci/.github/workflows/image-build.yml@8782d42e1d4e5cd0b8af9d1a14c9d5414976a4c9 # v0.7.0
    with:
      image: editable-blog
      # A real value, as release.yml passes one, so the PR image builds the way the release does.
      build-args: VERSION=0.0.0-pr
