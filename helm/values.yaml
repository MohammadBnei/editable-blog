# editable-blog — deployed via infra-bootstrap's common-app-chart
# (gitops/apps/registry.yaml entry: editable-blog). Test subject for the
# ukubi-cluster Stage 1 platform validation before the Freebox cutover.

image:
  # Cut over to the in-cluster registry (infra-bootstrap ADR-0034). Built on
  # the build-runner LXC and pushed over the LAN; nodes pull over gigabit
  # instead of a residential downlink, and containerd is configured to trust
  # this plain-HTTP `.lan` host (Let's Encrypt cannot issue for `.lan`, so
  # there is no ingress and no certificate).
  #
  # The tag moves with the repository on purpose: the local registry has
  # 0.37.9, never 0.37.8, so flipping only the repository would pull a tag
  # that does not exist there.
  #
  # Both docker.yml and local-registry.yml trigger on tag pushes, so every
  # released tag lands in Docker Hub *and* here — which keeps docker.yml's
  # values-bump job correct and makes reverting this one line sufficient.
  repository: registry.bnei.lan:5000/editable-blog
  tag: "0.43.0"
service:
  port: 3000
ingress:
  hostname: blog.bnei.dev
  middlewares:
    - name: compress
    - name: sveltekit-cors
livenessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
# Same Infisical project/creds the legacy k8s-cluster/secrets/editable-blog.yml
# used (k8s-cluster repo, now superseded by this file) — same underlying
# Infisical Postgres DB as the new cluster's platform-infisical-backend, so
# no secret migration needed. The shared universal-auth-credentials machine
# identity (namespace infisical) must be granted access to this project in
# the Infisical UI first — separate grant from the main infra-bootstrap
# project, same as pgweb's pgweb-p9-hy grant.
infisical:
  enabled: true
  projectSlug: "editable-blog-555c"
  envSlug: staging
  secretsPath: "/"
  secretName: managed-editable-blog-secret
  autoReload: true
# bnei.dev bare domain also routed to the blog on the legacy cluster.
# common-app-chart's built-in IngressRoute only takes one hostname, so the
# second host is a raw extra manifest here rather than a chart change.
extraManifests:
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: {{ .Release.Name }}-root-domain
      namespace: {{ .Release.Namespace }}
    spec:
      entryPoints:
        - websecure
      routes:
        - kind: Rule
          match: Host(`bnei.dev`)
          middlewares:
            - name: compress
            - name: sveltekit-cors
          services:
            - kind: Service
              name: {{ .Release.Name }}
              port: {{ .Values.service.port }}
      tls:
        certResolver: {{ .Values.ingress.certResolver }}
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: compress
      namespace: {{ .Release.Namespace }}
    spec:
      compress: {}
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: sveltekit-cors
      namespace: {{ .Release.Namespace }}
    spec:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - OPTIONS
          - PUT
          - DELETE
        customRequestHeaders:
          X-Forwarded-Proto: "https"
          X-Forwarded-Host: "{{ "{{ .Host }}" }}"
        accessControlAllowOriginList:
          - "https://bnei.dev"
          - "https://blog.bnei.dev"
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
        accessControlMaxAge: 100
        addVaryHeader: true
