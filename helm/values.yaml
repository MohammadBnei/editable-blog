# editable-blog — deployed via infra-bootstrap's common-app-chart
# (gitops/apps/registry.yaml entry: editable-blog). Test subject for the
# ukubi-cluster Stage 1 platform validation before the Freebox cutover.

image:
  # Cut over to the in-cluster registry (infra-bootstrap ADR-0034). Built on
  # the build-runner LXC and pushed over the LAN; nodes pull over gigabit
  # instead of a residential downlink, and containerd is configured to trust
  # this plain-HTTP `.lan` host (Let's Encrypt cannot issue for `.lan`, so
  # there is no ingress and no certificate).
  #
  # The tag is the 12-char sha of the built commit: the release commit, or
  # an untagged one when main moved past (older tags are semver).
  # release.yml builds and pushes it on the ukubi-build runner, then its
  # deploy job bumps image.tag below with yq in a chore(deploy) commit.
  repository: registry.bnei.lan:5000/editable-blog
  tag: "0.44.18"
service:
  port: 3000
ingress:
  hostname: blog.bnei.dev
  middlewares:
    - name: compress
    - name: sveltekit-cors
livenessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
# bnei.dev bare domain also routed to the blog on the legacy cluster.
# common-app-chart's built-in IngressRoute only takes one hostname, so the
# second host is a raw extra manifest here rather than a chart change.
extraManifests:
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: {{ .Release.Name }}-root-domain
      namespace: {{ .Release.Namespace }}
    spec:
      entryPoints:
        - websecure
      routes:
        - kind: Rule
          match: Host(`bnei.dev`)
          middlewares:
            - name: compress
            - name: sveltekit-cors
          services:
            - kind: Service
              name: {{ .Release.Name }}
              port: {{ .Values.service.port }}
      tls:
        certResolver: {{ .Values.ingress.certResolver }}
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: compress
      namespace: {{ .Release.Namespace }}
    spec:
      compress: {}
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: sveltekit-cors
      namespace: {{ .Release.Namespace }}
    spec:
      headers:
        accessControlAllowMethods:
          - GET
          - OPTIONS
        customRequestHeaders:
          X-Forwarded-Proto: "https"
          # DO NOT ADD AN `X-Forwarded-Host` OVERRIDE HERE. There used to be
          # one, set to a Go-template placeholder for the request host.
          # Traefik v3 does not template customRequestHeaders — that was a v1
          # feature — so the header was set to those literal seven characters.
          # Harmless for this site's own server (adapter-static; server.js
          # never reads a forwarded header), but any middleware later in a
          # chain that trusts forwarded headers (authentik-forwardauth has
          # `trustForwardHeader: true`) gets the wrong host: authentik
          # answered 404 with an empty body for a host spelled with curly
          # braces, which cost infra-bootstrap#240 to chase down.
          # Traefik's own entrypoint already sets this header to the real
          # Host; overriding it only ever made it wrong.
        accessControlAllowOriginList:
          - "https://bnei.dev"
          - "https://blog.bnei.dev"
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
        accessControlMaxAge: 100
        addVaryHeader: true
