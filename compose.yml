services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ad
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - '5432:5432'

  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - ADMIN_PASSWORD
        - ORIGIN
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://user:pass@db:5432/ad?schema=public
      ADMIN_PASSWORD: test
    depends_on:
      - db

  pgweb:
    image: sosedoff/pgweb
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://user:pass@db:5432/ad?sslmode=disable
    depends_on:
      - db

secrets:
  ADMIN_PASSWORD:
    environment: ADMIN_PASSWORD
  ORIGIN:
    environment: ORIGIN



