services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ad
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - '5433:5432'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://user:pass@postgres:5432/ad?schema=public
      ADMIN_PASSWORD: test
    depends_on:
      - postgres

  pgweb:
    image: sosedoff/pgweb
    ports:
      - '8081:8081'
    environment:
      PGWEB_DATABASE_URL: postgres://user:pass@postgres:5432/ad?sslmode=disable
    depends_on:
      - postgres

secrets:
  ADMIN_PASSWORD:
    environment: ADMIN_PASSWORD
  ORIGIN:
    environment: ORIGIN
